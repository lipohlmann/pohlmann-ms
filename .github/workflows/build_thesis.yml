name: Build thesis and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compile LaTeX with latexmk
        uses: xu-cheng/latex-action@v4
        with:
          root_file: thesis.tex
          texlive_version: 2026
          # xu-cheng's image ships biber, so BibLaTeX resolves automatically

      - name: Assemble Pages site
        run: |
          mkdir -p site
          cp thesis.pdf site/thesis.pdf
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=main.pdf">
            <title>Pohlmann Masters Thesis</title>
          </head>
          <body>
            <p>Redirecting to <a href="thesis.pdf">the thesis PDF</a>…</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
